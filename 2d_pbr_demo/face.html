<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Face-controlled WebGL camera (minimal)</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      color: #eaeaea;
      font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: rgba(0,0,0,0.55);
      padding: 10px 12px;
      border-radius: 8px;
      max-width: min(520px, calc(100vw - 24px));
      user-select: text;
      white-space: pre;
    }
    #btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    #btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #video { display: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud">Initializing…</div>
  <button id="btn" type="button">Start webcam + face tracking</button>
  <video id="video" playsinline muted></video>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const hud = document.getElementById("hud");
    const btn = document.getElementById("btn");
    const video = document.getElementById("video");

    // Expose latest pose so you can plug it into your own WebGL app.
    // Units: arbitrary (relative), rotations in radians.
    window.facePose = {
      ok: false,
      x: 0,
      y: 0,
      z: 0,
      yaw: 0,
      pitch: 0,
      roll: 0,
      raw: null,
    };

    // Tune these to taste.
    // Bigger gains => stronger parallax.
    // By default we do NOT move the camera in Z; instead we use face Z to scale
    // the X/Y parallax strength (closer => stronger parallax).
    const faceToCamera = {
      xyGainBase: 0.09,
      zGain: 0.0,
      // How much the raw Z delta influences parallax strength.
      // If your Z delta numbers are big, reduce this.
      depthGain: 0.02,
      depthScaleMin: 0.5,
      depthScaleMax: 2.5,
      maxXYBase: 3.0,
      maxZ: 3.0,
    };

    function lerp(a, b, t) { return a + (b - a) * t; }
    function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }

    function rotationMatrixToEulerYXZRowMajor(m) {
      // Extract Euler (yaw around Y, pitch around X, roll around Z) from row-major 3x3.
      // This is a pragmatic extraction for camera control, not a strict convention guarantee.
      const r00 = m[0], r01 = m[1], r02 = m[2];
      const r10 = m[4], r11 = m[5], r12 = m[6];
      const r20 = m[8], r21 = m[9], r22 = m[10];

      // YXZ order (common for camera-like controls)
      const pitch = Math.asin(clamp(-r12, -1, 1));
      const yaw = Math.atan2(r02, r22);
      const roll = Math.atan2(r10, r11);
      return { yaw, pitch, roll };
    }

    function fmt(n) {
      if (!Number.isFinite(n)) return "NaN";
      const abs = Math.abs(n);
      if (abs >= 100) return n.toFixed(1);
      if (abs >= 10) return n.toFixed(2);
      return n.toFixed(3);
    }

    // --- Minimal Three.js scene (optional demo) ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 100);
    camera.position.set(0, 0, 3);

    const light = new THREE.DirectionalLight(0xffffff, 1.0);
    light.position.set(1, 2, 3);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.25));

    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x66aaff, metalness: 0.1, roughness: 0.35 })
    );
    scene.add(cube);

    const grid = new THREE.GridHelper(10, 10, 0x333333, 0x222222);
    grid.position.y = -1.2;
    scene.add(grid);

    addEventListener("resize", () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    // --- MediaPipe Face Landmarker ---
    let faceLandmarker = null;
    let neutral = null; // baseline translation to make deltas stable

    async function initLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        },
        runningMode: "VIDEO",
        numFaces: 1,
        minFaceDetectionConfidence: 0.5,
        minFacePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: true,
      });
    }

    async function startWebcam() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
    }

    function detectPose() {
      if (!faceLandmarker || video.readyState < 2) return;

      const now = performance.now();
      const result = faceLandmarker.detectForVideo(video, now);

      if (!result || !result.faceLandmarks || result.faceLandmarks.length === 0) {
        window.facePose.ok = false;
        return;
      }

      // Translation & rotation from face transformation matrix (row-major 4x4).
      const ftm = result.facialTransformationMatrixes?.[0]?.data;
      if (!ftm || ftm.length !== 16) {
        window.facePose.ok = true;
        window.facePose.raw = result;
        return;
      }

      // MediaPipe provides a 4x4 transform, but depending on the bundle/runtime it may be
      // interpreted as row-major or column-major.
      // - Row-major translation lives in the last column: indices 3, 7, 11.
      // - Column-major translation lives in the last row: indices 12, 13, 14.
      // We auto-select the one that actually varies (and isn’t near-zero).
      const txRow = ftm[3],  tyRow = ftm[7],  tzRow = ftm[11];
      const txCol = ftm[12], tyCol = ftm[13], tzCol = ftm[14];

      const rowScore = Math.abs(txRow) + Math.abs(tyRow) + Math.abs(tzRow);
      const colScore = Math.abs(txCol) + Math.abs(tyCol) + Math.abs(tzCol);
      const useColMajorTranslation = colScore > rowScore;

      const tx = useColMajorTranslation ? txCol : txRow;
      const ty = useColMajorTranslation ? tyCol : tyRow;
      const tz = useColMajorTranslation ? tzCol : tzRow;

      if (!neutral) neutral = { tx, ty, tz };
      const dx = tx - neutral.tx;
      const dy = ty - neutral.ty;
      const dz = tz - neutral.tz;

      const { yaw, pitch, roll } = rotationMatrixToEulerYXZRowMajor(ftm);

      // Use depth (dz) to scale how strong X/Y parallax is.
      // Convention here: moving closer typically decreases tz, so -dz increases.
      const depthScale = clamp(
        1 + (-dz) * faceToCamera.depthGain,
        faceToCamera.depthScaleMin,
        faceToCamera.depthScaleMax
      );

      const xyGain = faceToCamera.xyGainBase * depthScale;
      const maxXY = faceToCamera.maxXYBase * depthScale;

      const targetX = clamp(dx * xyGain, -maxXY, maxXY);
      const targetY = clamp(-dy * xyGain, -maxXY, maxXY);
      const targetZ = faceToCamera.zGain === 0
        ? 0
        : clamp(-dz * faceToCamera.zGain, -faceToCamera.maxZ, faceToCamera.maxZ);

      // Smooth to reduce jitter.
      const smooth = 0.18;
      window.facePose.ok = true;
      window.facePose.x = lerp(window.facePose.x, targetX, smooth);
      window.facePose.y = lerp(window.facePose.y, targetY, smooth);
      window.facePose.z = lerp(window.facePose.z, targetZ, smooth);
      window.facePose.yaw = lerp(window.facePose.yaw, yaw, 0.12);
      window.facePose.pitch = lerp(window.facePose.pitch, pitch, 0.12);
      window.facePose.roll = lerp(window.facePose.roll, roll, 0.12);
      window.facePose.depthScale = depthScale;
      window.facePose.zRawDelta = dz;
      window.facePose.raw = result;
    }

    function render() {
      // Run face detection each frame (simple + minimal).
      detectPose();

      // Example: map facePose -> camera. Plug this mapping into your own app.
      if (window.facePose.ok) {
        // Move camera opposite to your head for a "window" illusion.
        const baseZ = 3.0;
        camera.position.x = -window.facePose.x;
        camera.position.y = -window.facePose.y;
        camera.position.z = baseZ - window.facePose.z;
        camera.lookAt(0, 0, 0);
      }

    //   cube.rotation.y += 0.008;
    //   cube.rotation.x += 0.004;

      hud.textContent =
        "Face tracking: " + (window.facePose.ok ? "OK" : "no face") + "\n" +
        "pos (x,y,z): " + fmt(window.facePose.x) + ", " + fmt(window.facePose.y) + ", " + fmt(window.facePose.z) + "\n" +
        "rot (yaw,pitch,roll): " + fmt(window.facePose.yaw) + ", " + fmt(window.facePose.pitch) + ", " + fmt(window.facePose.roll) + "\n" +
        "xyGainBase: " + faceToCamera.xyGainBase + "  depthScale: " + fmt(window.facePose.depthScale ?? 1) + "\n" +
        "zRawDelta: " + fmt(window.facePose.zRawDelta ?? 0) + "  zGain: " + faceToCamera.zGain + "\n" +
        "raw translation (row): " + fmt(window.facePose.raw?.facialTransformationMatrixes?.[0]?.data?.[3]) + ", " + fmt(window.facePose.raw?.facialTransformationMatrixes?.[0]?.data?.[7]) + ", " + fmt(window.facePose.raw?.facialTransformationMatrixes?.[0]?.data?.[11]) + "\n" +
        "raw translation (col): " + fmt(window.facePose.raw?.facialTransformationMatrixes?.[0]?.data?.[12]) + ", " + fmt(window.facePose.raw?.facialTransformationMatrixes?.[0]?.data?.[13]) + ", " + fmt(window.facePose.raw?.facialTransformationMatrixes?.[0]?.data?.[14]) + "\n" +
        "\n" +
        "Use window.facePose in your WebGL app.";

      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      hud.textContent = "Requesting webcam permission…";
      try {
        await startWebcam();
        hud.textContent = "Loading face model (first time may take a moment)…";
        await initLandmarker();
        hud.textContent = "Running. Move your head to move the camera.";
        requestAnimationFrame(render);
      } catch (err) {
        console.error(err);
        hud.textContent = "Error: " + (err?.message ?? String(err));
        btn.disabled = false;
      }
    });
    btn.click();

    hud.textContent =
      "This page runs in-browser face tracking (MediaPipe) and maps it to a WebGL camera.\n" +
      "Click the button to start.";

    if (!navigator.mediaDevices?.getUserMedia) {
      hud.textContent = "getUserMedia is not available in this browser.";
      btn.disabled = true;
    }
  </script>
</body>
</html>
